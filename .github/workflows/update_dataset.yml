name: Refresh Production F1 Data

on:
  schedule:
    # Run every Monday after a race weekend.
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  refresh-production-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Rebuild production dataset and retrain models
      run: |
        python scripts/refresh_production.py --start-season 2019

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'f1-outcome-bot'
        git config --global user.email 'f1-outcome-bot@users.noreply.github.com'
        git add data/processed/final_hybrid_dataset.parquet
        git add artifacts/final/
        if git diff --staged --quiet; then
          echo "No new race data found to commit."
        else
          git commit -m "chore(data): refresh production race data and models"
          git push origin HEAD
        fi
