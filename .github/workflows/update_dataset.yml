name: F1 Data Automation

on:
  schedule:
    # Run every Monday at 12:00 UTC (noon) after a race weekend
    - cron: '0 12 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Build Dataset & Retrain Models (2025 & 2026)
      run: |
        echo "Running build_dataset.py for 2025 and 2026..."
        # If FastF1 raises a rate limit or Jolpica is down, the script will fail here and notify the repo owner
        python scripts/build_dataset.py --seasons 2025 2026

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'f1-outcome-bot'
        git config --global user.email 'f1-outcome-bot@users.noreply.github.com'
        
        # Add updated datasets and retrained models
        git add data/processed/f1_historical_processed.parquet
        git add artifacts/final/
        
        # Check if there are actual changes
        if git diff --staged --quiet; then
          echo "No new race data found to commit."
        else
          git commit -m "chore(data): Automated dataset & model update after race weekend"
          # Push strictly back to the branch that triggered the action
          git push origin HEAD
        fi
