name: Automated Data Update

on:
  schedule:
    # Run at 09:00 UTC every Monday (after race Sunday)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Data Update Script
        run: python scripts/update_dataset.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "F1 Oracle Bot"
          git config --global user.email "bot@f1oracle.ai"
          git add data/processed/final_hybrid_dataset.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update dataset: $(date +'%Y-%m-%d')" && git push)
